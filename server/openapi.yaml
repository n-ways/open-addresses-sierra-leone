openapi: "3.1.0"
info:
  title: "N-Ways Addressing for Sierra Leone: registry API"
  version: "1.0"
  description: "Serves the published registry of N-Ways codes for Sierra Leone and, on the deployment designated as the country's issuer, issues new codes by the national rules. Every example is a real response from a server holding the published registry. Errors share one shape (Error). Credit every use: \"N-Ways Addressing for Sierra Leone, © N-WAYS LIMITED (nways.ng)\"."
  license:
    name: "Apache-2.0 (code); ODbL-1.0 (data)"
    identifier: "Apache-2.0"
  contact:
    name: "N-WAYS LIMITED"
    email: "hello@nways.ng"
    url: "https://nways.ng"
servers:
  - url: "/"
    description: "This deployment"
paths:
  "/v1/health":
    get:
      operationId: "health"
      summary: "Health and the registry in service"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
              examples:
                health:
                  summary: "Health"
                  value:
                    status: "ok"
                    country: "SL"
                    codes: 1359282
                    exported: "2026-10-20T15:54:15Z"
                    issuing: true
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
      security: []
