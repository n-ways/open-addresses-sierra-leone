components:
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            code:
              type: "string"
              description: "Stable code for programs."
            message:
              type: "string"
              description: "Explanation for people."
            card:
              "$ref": "#/components/schemas/Card"
          required:
            - "code"
            - "message"
      required:
        - "error"
    Spot:
      type: "object"
      properties:
        full:
          type: "string"
          description: "10-character Plus Code."
        short:
          type: "string"
          description: "Short form with its reference town."
        precise:
          type: "string"
          description: "11-character Plus Code."
        town:
          type:
            - "string"
            - "null"
      required:
        - "full"
        - "short"
        - "precise"
    Area:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Area index in 5 digits (the `zone` column of the registry rows)."
          pattern: "^[0-9]{5}$"
        plateName:
          type: "string"
          description: "The name in the code: at most 12 characters and 2 words."
        officialName:
          type: "string"
        nameProvisional:
          type: "boolean"
          description: "The council has yet to confirm the plate name."
        district:
          type: "string"
        placeLine:
          type: "string"
        place:
          type: "string"
        fccArea:
          type: "boolean"
        nameKey:
          type: "string"
        nameId:
          type: "integer"
        zone:
          type: "string"
          description: "The zone (registry file) of the area."
      required:
        - "id"
        - "plateName"
        - "officialName"
        - "district"
        - "nameKey"
        - "nameId"
        - "zone"
    AreaFull:
      allOf:
        - "$ref": "#/components/schemas/Area"
        - type: "object"
          properties:
            seed:
              type: "object"
              properties:
                id:
                  type: "string"
                lat:
                  type: "number"
                lng:
                  type: "number"
                tier:
                  type: "string"
                  enum:
                    - "primary"
                    - "secondary"
            blocks:
              type: "array"
              items:
                type: "object"
                properties:
                  lo:
                    type: "integer"
                  hi:
                    type: "integer"
                  digits:
                    type: "integer"
                  size:
                    type: "integer"
            codes:
              type: "integer"
            byStatus:
              type: "object"
              additionalProperties:
                type: "integer"
            name:
              type: "object"
              properties:
                key:
                  type: "string"
                id:
                  type: "integer"
                digits:
                  type: "integer"
                spare:
                  type: "object"
                  properties:
                    lo:
                      type: "integer"
                    hi:
                      type: "integer"
                areas:
                  type: "array"
                  items:
                    type: "string"
    Card:
      type: "object"
      properties:
        country:
          type: "string"
          const: "SL"
        machine:
          type: "string"
          pattern: "^SL-[0-9]{5}-[0-9]{3,5}$"
        remembered:
          type: "string"
        written:
          type: "string"
        spoken:
          type: "string"
        check:
          type: "integer"
          description: "Damm check digit over the name id and the number; for systems only."
        number:
          type: "integer"
        status:
          type: "string"
          enum:
            - "provisional"
            - "confirmed"
            - "retired"
        issued:
          type: "string"
          enum:
            - "bulk"
            - "on-demand"
        issuedAt:
          type: "string"
          format: "date-time"
        officialAddress:
          type:
            - "string"
            - "null"
          description: "In Freetown City Council's area: the property's Plus Code, the official address."
        coverage:
          type:
            - "string"
            - "null"
          enum:
            - "official"
            - null
        area:
          "$ref": "#/components/schemas/Area"
        zone:
          type: "object"
          properties:
            key:
              type: "string"
            name:
              type: "string"
        placeLine:
          type: "string"
        fullLine:
          type: "string"
        entrance:
          type: "object"
          properties:
            lat:
              type: "number"
            lng:
              type: "number"
            kind:
              type: "string"
              enum:
                - "centre"
                - "door"
                - "gate"
        spot:
          "$ref": "#/components/schemas/Spot"
        building:
          type: "object"
          properties:
            class:
              type: "string"
            use:
              type: "string"
            kind:
              type: "string"
            structures:
              type: "integer"
            floorAreaM2:
              type: "number"
            rule:
              type:
                - "string"
                - "null"
            estate:
              type:
                - "string"
                - "null"
        outline:
          type:
            - "array"
            - "null"
          items:
            type: "array"
            items:
              type: "number"
            minItems: 2
            maxItems: 2
        record:
          type: "object"
          properties:
            machine:
              type: "string"
            home:
              type: "string"
            written:
              type: "string"
            zone:
              type: "string"
            official_name:
              type: "string"
            district:
              type: "string"
            number:
              type: "string"
            check:
              type: "string"
            status:
              type: "string"
            issued:
              type: "string"
            issued_at:
              type: "string"
            entrance_lat:
              type: "string"
            entrance_lng:
              type: "string"
            entrance_kind:
              type: "string"
            plus_code:
              type: "string"
            fcc_address:
              type: "string"
            class:
              type: "string"
            use:
              type: "string"
            kind:
              type: "string"
            structures:
              type: "string"
            floor_area_m2:
              type: "string"
            rule:
              type: "string"
            estate:
              type: "string"
          required:
            - "machine"
            - "home"
            - "written"
            - "zone"
            - "official_name"
            - "district"
            - "number"
            - "check"
            - "status"
            - "issued"
            - "issued_at"
            - "entrance_lat"
            - "entrance_lng"
            - "entrance_kind"
            - "plus_code"
            - "fcc_address"
            - "class"
            - "use"
            - "kind"
            - "structures"
            - "floor_area_m2"
            - "rule"
            - "estate"
          description: "Every column of the published registry row, as published."
        credit:
          type: "string"
        creditUrl:
          type: "string"
        distanceM:
          type: "number"
        structure:
          type: "integer"
        unit:
          type: "integer"
        newBlock:
          type: "object"
          properties:
            lo:
              type: "integer"
            hi:
              type: "integer"
      required:
        - "country"
        - "machine"
        - "remembered"
        - "written"
        - "check"
        - "status"
        - "area"
        - "zone"
